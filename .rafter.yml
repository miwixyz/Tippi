# Rafter-Konfiguration — Tippi
#
# Hier stehen NUR Findings, die nach Nachverfolgung des Input-→-Sink-Pfads
# nachweislich nicht ausnutzbar sind. Jeder Eintrag nennt den Grund und das
# Datum der Analyse. Wer einen Eintrag anfasst, prüft die Begründung neu.

ignore:
  # ── R-5F5C6 · Nicht-konstantzeitiger Secret-Vergleich ──────────────────────
  # Gemeldet auf `apiKey == loadedApiKey` in ProviderRow.onChange(of: refreshTick).
  # Das ist KEIN Authentifizierungs-Vergleich, sondern ein UI-Dirty-Check:
  # "hat der Nutzer dieses Feld geändert, seit es geladen wurde?" — er
  # entscheidet nur, ob die Zeile neu geladen werden darf, ohne ungespeicherte
  # Eingaben zu verwerfen (der Fix aus dem v1.18.1-Audit).
  #
  # Ein Timing-Seitenkanal setzt einen Angreifer voraus, der die Vergleichszeit
  # misst und das Geheimnis zeichenweise errät. Hier gibt es nichts zu erraten:
  # beide Werte gehören dem Nutzer, liegen im selben Prozess auf seinem eigenen
  # Mac, und wer diesen Prozess beobachten kann, liest den Key ohnehin direkt
  # aus dem Speicher oder dem Schlüsselbund. Ein konstantzeitiger Vergleich
  # würde hier keinerlei Angriff verhindern.
  # Analysiert 2026-09-02.
  - rule: R-5F5C6
    paths:
      - "Tippi/UI/SettingsView.swift"

  # ── R-F7958 · "Veraltete API-Version" auf OpenRouter-Endpoint ──────────────
  # Gemeldet auf `https://openrouter.ai/api/v1/chat/completions` in
  # OpenRouterProvider.swift:22. Die Regel flaggt pauschal jedes "/v0/" oder
  # "/v1/" in einer URL als potenziell veraltet.
  #
  # Das ist hier kein Legacy-Pfad, sondern OpenRouters aktuelle, stabile
  # API-Version — es gibt keine v2, "v1" ist der permanente, dokumentierte
  # Namespace. Derselbe Fehlalarm würde auch OpenAIProvider.swift treffen
  # (`https://api.openai.com/v1/chat/completions`, siehe dort Zeile 17) —
  # exakt dasselbe Muster, exakt derselbe aktuelle Endpoint.
  # Analysiert 2026-09-09.
  - rule: R-F7958
    paths:
      - "Tippi/LLM/OpenRouterProvider.swift"

  # ── R-5F5C6 · "Secret-Vergleich" auf der Markierungs-Signatur ──────────────
  # Gemeldet auf `signature == dismissedSignature` in
  # SelectionActionBarPanel.swift:174. `SelectionSignature` ist kein Geheimnis,
  # sondern ein Wiedererkennungsmerkmal einer Markierung (pid, markierter
  # Text, Position). Der Vergleich entscheidet nur, ob die eben geschlossene
  # Leiste für dieselbe Markierung wieder aufspringen darf. Beide Werte stammen
  # aus demselben Prozess, kein Angreifer liefert einen Wert oder misst die
  # Zeit. Der markierte Text liegt nur im Speicher, wird nicht gespeichert.
  # Analysiert 2026-10-01.
  - rule: R-5F5C6
    paths:
      - "Tippi/UI/SelectionPopup/SelectionActionBarPanel.swift"

  # ── R-F7958 · "Veraltete API-Version" in Kommentaren ──────────────────────
  # Gemeldet auf ProviderModelPresets.swift:39 und :209. Beide Treffer sind
  # Kommentare, die die Prüfung gegen OpenRouters `/api/v1/models` belegen.
  # Kein Code ruft dort eine URL auf; v1 ist OpenRouters aktuelle Version.
  # Analysiert 2026-10-01.
  - rule: R-F7958
    paths:
      - "Tippi/LLM/ProviderModelPresets.swift"

  # ── R-C66D8 · Nicht-kryptografischer Zufall im Messskript ──────────────────
  # Gemeldet auf `random.Random(a.seed)` in scripts/autocomplete-pruefstand.py.
  # Das Skript mischt nur die Reihenfolge der Antwortwege für einen Blindtest.
  # Der feste Seed ist Absicht (Durchläufe wiederholbar). Das Skript läuft nur
  # lokal, ist nicht Teil der App, erzeugt keine Passwörter oder Tokens
  # (der Passwortgenerator der App ist Swift-Code).
  # Analysiert 2026-10-01.
  - rule: R-C66D8
    paths:
      - "scripts/autocomplete-pruefstand.py"

  # ── R-803BC · "XPath query built with string concatenation" ────────────────
  # Gemeldet auf scripts/modell-pruefstand.py:144 — `src.find(f'id: "{pid}"')`.
  # Das ist keine XPath-Abfrage, sondern Pythons str.find() über Tippis EIGENEN
  # Quelltext (DemoPrompt.swift), um den Prompt-Block zu einer ID zu finden.
  # `pid` stammt aus den Testfällen im Skript bzw. aus
  # scripts/modell-pruefstand-abnahme.json (im Repo, von Michael gepflegt) —
  # kein Nutzer- oder Netzwerkinput, kein XML, kein Abfrage-Interpreter.
  # Das Skript läuft nur lokal vor einem Modellwechsel und wird nicht ausgeliefert.
  # Analysiert 2026-10-02.
  - rule: R-803BC
    paths:
      - "scripts/modell-pruefstand.py"
