name: Tippi
options:
  bundleIdPrefix: com.tippi
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

targets:
  Tippi:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tippi
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tippi.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tippi.app
        PRODUCT_NAME: Tippi
        MARKETING_VERSION: "1.0.0-dev"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Tippi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tippi/Resources/Tippi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
