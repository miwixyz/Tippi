name: Tippi
options:
  bundleIdPrefix: com.tippi
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.12.4

targets:
  Tippi:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: GRDB
        product: GRDB
      - package: FluidAudio
        product: FluidAudio
    sources:
      - path: Tippi
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tippi.entitlements"
          - "Helpers/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tippi.app
        PRODUCT_NAME: Tippi
        MARKETING_VERSION: "1.19.0"
        CURRENT_PROJECT_VERSION: "196"
        INFOPLIST_FILE: Tippi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tippi/Resources/Tippi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
