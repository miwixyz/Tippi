name: Tippi
options:
  bundleIdPrefix: com.tippi
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1   # GHSA-hg88-v3cw-3qrh + GHSA-g3hp-f6mg-559v betreffen <= 2.9.1 (2026-11-11)
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.17.3
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.0.0
  # Autovervollständigung im eigenen Prozess (2026-10-13, SECURE-DESIGN-autocomplete §10).
  # Bewusst exakte Versionen: bringen Metal-Code und Modell-Lader mit.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5

targets:
  Tippi:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: GRDB
        product: GRDB
      - package: FluidAudio
        product: FluidAudio
      - package: Yams
        product: Yams
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      # Stream-Deck-Plugin: eigenes Programm mit eigener Kennung, damit Tippi den Absender am Socket prüfen kann.
      - target: TippiDeck
        embed: true
        link: false
        codeSign: true
        copy:
          destination: resources
          subpath: dev.mwlr.tippi.deck.sdPlugin
    sources:
      - path: Tippi
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tippi.entitlements"
          - "Resources/Tippi.debug.entitlements"
          - "Helpers/**"
      # Stream-Deck-Plugin (docs/SECURE-DESIGN-stream-deck.md): Manifest, Layout, Einstellungsseite, Symbole, Profile als
      # Ordner nach Contents/Resources. Das Programm `tippideck` kommt über die Abhängigkeit unten in denselben Ordner.
      - path: TippiDeck/dev.mwlr.tippi.deck.sdPlugin
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tippi.app
        PRODUCT_NAME: Tippi
        MARKETING_VERSION: "2.43.0"
        CURRENT_PROJECT_VERSION: "739"
        INFOPLIST_FILE: Tippi/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Automatic
        # Without an explicit team, automatic signing works in Xcode (which
        # reads the team from the UI) but `xcodebuild` from the command line
        # fails with "has entitlements that require signing with a development
        # certificate". That pushed builds to Xcode, and Xcode does not run the
        # Makefile's whisper-cli copy step — which is why the installed 2.9.0
        # shipped without a dictation binary (found 2026-09-14).
        # No PROVISIONING_PROFILE_SPECIFIER: naming a profile by hand while
        # CODE_SIGN_STYLE is Automatic is a conflict xcodebuild refuses to
        # resolve. Automatic picks the matching profile itself now that this
        # Mac is registered in the developer account. Nothing in scripts/ or
        # the Makefile referenced the profile name.
        DEVELOPMENT_TEAM: LTKJ6Z2VYB
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Split by configuration, not one shared entitlements file — see
        # Tippi.debug.entitlements' own header comment (/diagnose,
        # 2026-09-15) for why. Release MUST keep pointing at Tippi.entitlements
        # unchanged: scripts/release.sh reads the *effective* entitlements back
        # out of the exportArchive output and re-signs with exactly that, so
        # whatever this config setting embeds is what ships and gets notarized.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tippi/Resources/Tippi.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Tippi/Resources/Tippi.entitlements
    scheme:
      testTargets:
        - TippiTests
      shared: true

  # Stream-Deck-Plugin „TippiDeck“ (docs/SECURE-DESIGN-stream-deck.md): von Elgatos Stream Deck gestartet, spricht dessen
  # WebSocket und Tippis geprüften Socket `deck.sock`. Keine Berechtigungen. Nachrichtenformat = dieselbe Datei wie in Tippi
  # (DeckWire). Kennung im Programm (eingebettete Info.plist), weil Tippi den Peer an `dev.mwlr.tippi.deck` erkennt.
  # Vorbild: GnotchiDeck (Gnotchi G59).
  TippiDeck:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TippiDeck
        excludes:
          - dev.mwlr.tippi.deck.sdPlugin/**
      - path: Tippi/Deck/DeckWire.swift
    settings:
      base:
        PRODUCT_NAME: tippideck
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.tippi.deck
        MARKETING_VERSION: "2.43.0"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LTKJ6Z2VYB
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        SKIP_INSTALL: YES

  TippiTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TippiTests
      # Stream Deck: pure parts of the plugin (marquee, logic) are tested here too.
      - path: TippiDeck/Marquee.swift
      - path: TippiDeck/DeckLogic.swift
    dependencies:
      - target: Tippi
    settings:
      base:
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        # TippiDeck/DeckLogic.swift imports the app module only here (DeckWire lives there); in the plugin it is compiled in.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DECK_IN_TESTS"
        # Must match the host app's team. Without these the bundle is signed
        # "Sign to Run Locally" (ad-hoc, no Team ID) while Tippi.app carries
        # LTKJ6Z2VYB, and macOS then refuses to dlopen the tests into the host:
        # "mapping process and mapped file (non-platform) have different Team
        # IDs". Nobody had seen that before 2026-09-15 because the get-task-allow
        # hang (see Tippi.debug.entitlements) always struck first.
        DEVELOPMENT_TEAM: LTKJ6Z2VYB
        CODE_SIGN_STYLE: Automatic
